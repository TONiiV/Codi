<!doctype html>
<!--
  PROTOTYPE, wipe me. Round 2: the Codi "工作" tab (beside "代码"), in the Editorial look from
  proto/b-editorial. Three variants on one route, ?variant=A|B|C, floating bar or arrow keys.
  The question: how do a personal Chief of Staff (私人幕僚长, customisable persona, executes) and a
  company Chief of Staff (公司总台, shared, read-only, permission-filtered) share one screen?
  A viewer switch (管理员 / 负责人 / 成员) in the top bar shows what each level gets to see.
  Mock data only. Open: apps/lighthouse/prototype/index.html
-->
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Codi 工作 · 原型</title>
    <style>
      :root {
        --paper: #f5f3f0;
        --paper-sunk: #efece7;
        --card: #fff;
        --ink: #16130f;
        --ink2: #4b453d;
        --muted: #8e877d;
        --faint: #b3aca2;
        --rule: #e6e2db;
        --rule-strong: #d3cec4;
        --shell: #100f0d;
        --shell2: #1a1815;
        --shell-ink: #edeae4;
        --shell-muted: #837d74;
        --shell-rule: #272420;
        --live: #2f6b4f;
        --warn: #9a6a1e;
        --stop: #a33c2e;
        --cool: #2f4d86;
        --sans:
          ui-sans-serif, -apple-system, "SF Pro Text", "PingFang SC", "Hiragino Sans GB",
          "Source Han Sans SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
        --serif:
          ui-serif, "Iowan Old Style", Georgia, "Songti SC", "Source Han Serif SC",
          "Noto Serif CJK SC", serif;
        --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, "PingFang SC", monospace;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        background: var(--shell);
        color: var(--ink);
        font: 14px/1.6 var(--sans);
        -webkit-font-smoothing: antialiased;
        letter-spacing: 0.01em;
      }
      button {
        font: inherit;
        cursor: pointer;
      }
      .eyebrow {
        font-size: 10px;
        line-height: 1;
        font-weight: 600;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        font-variant-numeric: tabular-nums;
      }
      .headline {
        font-weight: 700;
        letter-spacing: -0.025em;
        line-height: 1.16;
      }
      .num {
        font-variant-numeric: tabular-nums;
        letter-spacing: -0.03em;
      }
      .serif {
        font-family: var(--serif);
      }
      .muted {
        color: var(--muted);
      }
      .faint {
        color: var(--faint);
      }
      .ink2 {
        color: var(--ink2);
      }
      .live {
        color: var(--live);
      }
      .warn {
        color: var(--warn);
      }
      .stop {
        color: var(--stop);
      }
      .cool {
        color: var(--cool);
      }
      .rule {
        height: 1px;
        background: var(--rule);
      }
      /* shell */
      .app {
        display: flex;
        height: 100%;
      }
      aside.shell {
        width: 248px;
        flex-shrink: 0;
        background: var(--shell);
        color: var(--shell-ink);
        display: flex;
        flex-direction: column;
        padding: 24px 12px 12px;
      }
      .logo {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 8px 18px;
      }
      .logo i {
        display: inline-flex;
        width: 26px;
        height: 26px;
        border-radius: 7px;
        background: var(--shell-ink);
        align-items: center;
        justify-content: center;
      }
      .logo i::after {
        content: "";
        width: 10px;
        height: 10px;
        border-radius: 2px;
        background: var(--shell);
      }
      .logo .eyebrow {
        color: var(--shell-ink);
      }
      .mode {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 4px;
        margin: 0 2px 20px;
        border: 1px solid var(--shell-rule);
        border-radius: 9px;
        padding: 3px;
      }
      .mode button {
        border: 0;
        border-radius: 7px;
        background: transparent;
        color: var(--shell-muted);
        padding: 7px 0;
        font-size: 12.5px;
      }
      .mode button.on {
        background: var(--shell-ink);
        color: var(--shell);
      }
      .navh {
        padding: 0 10px 8px;
        color: var(--shell-muted);
      }
      .nav button {
        display: flex;
        width: 100%;
        align-items: center;
        gap: 10px;
        border: 0;
        background: transparent;
        color: rgba(237, 234, 228, 0.62);
        padding: 8px 10px;
        border-radius: 9px;
        text-align: left;
        font-size: 13.5px;
      }
      .nav button.on {
        background: var(--shell2);
        color: var(--shell-ink);
        font-weight: 500;
      }
      .nav button .eyebrow {
        margin-left: auto;
        color: var(--shell-muted);
      }
      .nav .glyph {
        display: inline-flex;
        width: 24px;
        height: 24px;
        border-radius: 7px;
        border: 1px solid var(--shell-rule);
        align-items: center;
        justify-content: center;
        font-size: 12px;
      }
      .nav button.on .glyph {
        background: var(--shell-ink);
        color: var(--shell);
        border-color: transparent;
      }
      .me {
        margin-top: auto;
        border-top: 1px solid var(--shell-rule);
        padding: 14px 8px 4px;
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .me i {
        display: inline-flex;
        width: 26px;
        height: 26px;
        border-radius: 50%;
        border: 1px solid var(--shell-rule);
        align-items: center;
        justify-content: center;
        font-size: 11px;
        font-style: normal;
      }
      .me .eyebrow {
        color: var(--shell-muted);
        margin-top: 3px;
      }
      .paper {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        background: var(--paper);
        border-radius: 20px 0 0 20px;
        overflow: hidden;
      }
      header.bar {
        height: 60px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        gap: 20px;
        border-bottom: 1px solid var(--rule);
        padding: 0 32px;
        font-size: 12.5px;
      }
      header.bar .crumb span + span::before {
        content: " / ";
        color: var(--faint);
      }
      header.bar .viewer {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      header.bar .viewer .eyebrow {
        color: var(--faint);
        margin-right: 4px;
      }
      .pill {
        border-radius: 999px;
        border: 1px solid var(--rule);
        background: var(--card);
        color: var(--ink2);
        padding: 4px 12px;
        font-size: 12px;
      }
      .pill.on {
        border-color: var(--ink);
        background: var(--ink);
        color: var(--paper);
      }
      main.page {
        flex: 1;
        min-height: 0;
        overflow: auto;
        padding: 32px 32px 100px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--rule);
        border-radius: 14px;
        padding: 22px 24px;
      }
      .sh .eyebrow {
        color: var(--faint);
      }
      .sh h2 {
        margin: 10px 0 0;
        font-size: 34px;
      }
      .sh h2.md {
        font-size: 23px;
      }
      .sh h2.sm {
        font-size: 17px;
      }
      .sh p {
        margin: 8px 0 0;
        max-width: 62ch;
        font-size: 13.5px;
        line-height: 1.75;
        color: var(--muted);
      }
      .tiles {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
        gap: 12px;
      }
      .tile {
        min-height: 116px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        background: var(--card);
        border: 1px solid var(--rule);
        border-radius: 14px;
        padding: 18px 20px;
      }
      .tile .eyebrow {
        color: var(--faint);
      }
      .tile b {
        font-size: 38px;
        line-height: 1;
        font-weight: 600;
      }
      .tile small {
        display: block;
        margin-top: 6px;
        font-size: 12px;
        color: var(--muted);
      }
      .list > li {
        list-style: none;
        padding: 14px 0;
        border-top: 1px solid var(--rule);
      }
      .list > li:first-child {
        border-top: 0;
      }
      .list {
        margin: 0;
        padding: 0;
      }
      .row {
        display: flex;
        gap: 16px;
        align-items: baseline;
      }
      .row .t {
        width: 64px;
        flex-shrink: 0;
        font-size: 12px;
        color: var(--faint);
      }
      .row .who {
        font-weight: 500;
      }
      .row .who .eyebrow {
        color: var(--faint);
        margin-left: 8px;
      }
      .dot {
        display: inline-block;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--faint);
        margin-right: 6px;
        vertical-align: 1px;
      }
      .dot.live {
        background: var(--live);
      }
      .dot.warn {
        background: var(--warn);
      }
      .dot.stop {
        background: var(--stop);
      }
      .dot.cool {
        background: var(--cool);
      }
      .locked {
        color: var(--faint);
        font-style: normal;
      }
      .locked::before {
        content: "锁 ";
        font-size: 10px;
        letter-spacing: 0.2em;
      }
      .av {
        display: inline-flex;
        width: 30px;
        height: 30px;
        border-radius: 8px;
        background: var(--ink);
        color: var(--paper);
        align-items: center;
        justify-content: center;
        font-size: 13px;
        flex-shrink: 0;
      }
      .av.light {
        background: var(--paper-sunk);
        color: var(--ink);
        border: 1px solid var(--rule);
      }
      /* transcript */
      .msg {
        display: grid;
        grid-template-columns: 30px 1fr;
        gap: 14px;
        padding: 16px 0;
        border-top: 1px solid var(--rule);
      }
      .msg:first-child {
        border-top: 0;
      }
      .msg .name {
        font-size: 13px;
        font-weight: 600;
      }
      .msg .name .eyebrow {
        color: var(--faint);
        margin-left: 8px;
        font-weight: 600;
      }
      .msg .name time {
        float: right;
        font-size: 11px;
        color: var(--faint);
        font-weight: 400;
      }
      .msg .body {
        margin-top: 4px;
        font-size: 14px;
        line-height: 1.9;
        color: var(--ink2);
      }
      .msg.user .body {
        color: var(--ink);
        font-weight: 500;
      }
      .msg .inline {
        margin-top: 10px;
        border: 1px solid var(--rule);
        border-radius: 12px;
        padding: 12px 14px;
        background: var(--paper);
      }
      .msg .inline .eyebrow {
        color: var(--faint);
      }
      .joinrule {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 0;
        color: var(--faint);
        font-size: 11px;
      }
      .joinrule::before,
      .joinrule::after {
        content: "";
        flex: 1;
        height: 1px;
        background: var(--rule);
      }
      .composer {
        display: flex;
        gap: 12px;
        align-items: center;
        border: 1px solid var(--rule);
        border-radius: 14px;
        background: var(--card);
        padding: 12px 14px 12px 18px;
        margin-top: 18px;
      }
      .composer input {
        flex: 1;
        border: 0;
        outline: 0;
        background: transparent;
        font: inherit;
        font-size: 14px;
        color: var(--ink);
      }
      .composer input::placeholder {
        color: var(--faint);
      }
      .send {
        border: 1px solid var(--ink);
        background: var(--ink);
        color: var(--paper);
        border-radius: 999px;
        padding: 6px 16px;
        font-size: 12.5px;
      }
      .ghost {
        border: 1px solid var(--rule);
        background: var(--card);
        color: var(--ink2);
        border-radius: 999px;
        padding: 6px 14px;
        font-size: 12.5px;
      }
      /* decision branches: border style carries meaning */
      .branch {
        border-left: 2px solid var(--ink);
        padding: 6px 0 6px 14px;
        margin: 8px 0;
      }
      .branch.rejected {
        border-left-style: dashed;
        border-left-color: var(--rule-strong);
        color: var(--muted);
      }
      .branch.open {
        border-left-style: dashed;
        border-left-color: var(--warn);
      }
      .branch .eyebrow {
        color: var(--faint);
      }
      /* layouts */
      .two {
        display: grid;
        grid-template-columns: minmax(300px, 380px) minmax(0, 1fr);
        gap: 28px;
      }
      .frontpage {
        display: grid;
        grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr);
        gap: 28px;
      }
      .frontpage .lead {
        border-top: 3px solid var(--ink);
        padding-top: 14px;
      }
      .rail {
        position: sticky;
        top: 0;
        align-self: start;
      }
      .cols {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 20px;
      }
      @media (max-width: 1100px) {
        .two,
        .frontpage,
        .cols {
          grid-template-columns: 1fr;
        }
      }
      /* switcher + state */
      #switcher {
        position: fixed;
        left: 50%;
        bottom: 18px;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 10px;
        background: #111;
        color: #fff;
        border-radius: 999px;
        padding: 8px 10px 8px 14px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
        z-index: 50;
        font-size: 13px;
      }
      #switcher button {
        background: #333;
        color: #fff;
        border: 0;
        border-radius: 999px;
        width: 30px;
        height: 30px;
      }
      #switcher .lab {
        min-width: 260px;
        text-align: center;
      }
      #switcher .lab b {
        font-family: var(--mono);
      }
      #state {
        position: fixed;
        right: 12px;
        bottom: 12px;
        max-width: 380px;
        font-size: 11px;
        color: var(--muted);
        background: var(--card);
        border: 1px solid var(--rule);
        border-radius: 8px;
        padding: 6px 8px;
        z-index: 40;
      }
      #state b {
        color: var(--ink);
      }
    </style>
  </head>

          {
            kind: "merge",
            text: "官网 PR #88：CI 绿、评审通过。合并到 main？",
            from: "官网 · 总台转达",
          },
          {
            kind: "question",
            text: "W9 问：反查工具要不要返回已结算线程？默认不返回。",
            from: "Codi · W9",
          },
          {
            kind: "question",
            text: "移动端机器离线 2 小时，app#41 改派云容器？需要 Android 模拟器。",
            from: "移动端 · 幕僚长",
          },
        ],
        lead: [
          {
            kind: "merge",
            text: "你的 PR #88：CI 绿、评审通过。合并到 main？",
            from: "官网 · 总台转达",
          },
          {
            kind: "question",
            text: "RSS 封面图：用 og:image 还是首图？W4 两种都能做。",
            from: "官网 · W4",
          },
        ],
        member: [
          {
            kind: "question",
            text: "app#41 的机器离线，要我帮你申请云容器配额吗？",
            from: "你的助理",
          },
        ],
      };
      const esc = (s) =>
        String(s).replace(
          /[&<>"]/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c],
        );
      const R = () => ROLES[role],
        me = () => PERSONAL[role];
      const canSeeProject = (id) => R().projects.includes(id);
      const canSeeDoc = (d) => R().docs.includes(d.level);
      const head = (eyebrow, h, sub, size = "lg", right = "") =>
        `<div class="sh" style="display:flex;justify-content:space-between;align-items:flex-end;gap:24px"><div><div class="eyebrow">${eyebrow}</div><h2 class="headline ${size}">${h}</h2>${sub ? `<p>${sub}</p>` : ""}</div>${right ? `<div>${right}</div>` : ""}</div>`;
      const greet = () => {
        const h = new Date().getHours();
        return h < 11
          ? "GOOD MORNING"
          : h < 14
            ? "GOOD NOON"
            : h < 18
              ? "GOOD AFTERNOON"
              : "GOOD EVENING";
      };

      // shared fragments
      function projectsList(compact) {
        return `<ul class="list">${Object.entries(PROJECTS)
          .map(([id, p]) => {
            if (!canSeeProject(id))
              return `<li><div class="row"><span class="t"></span><span class="locked">${esc(p.name)} · 你没有这个项目的访问权，总台只能告诉你它存在</span></div></li>`;
            return `<li><div class="row"><span class="t"><span class="dot ${p.status}"></span></span><div style="flex:1;min-width:0"><div class="who">${esc(p.name)}<span class="eyebrow">${esc(p.lead)}</span></div><div class="ink2" style="margin-top:3px">${esc(p.line)}</div>${compact ? "" : `<div class="muted" style="font-size:12px;margin-top:4px">${p.workers} 个 Worker · ${esc(p.pr)}</div>`}</div></div></li>`;
          })
          .join("")}</ul>`;
      }
      function docsList() {
        return `<ul class="list">${DOCS.map((d) => (canSeeDoc(d) ? `<li><div class="row"><span class="t eyebrow" style="width:92px">${esc(d.eyebrow)}</span><div><div class="who">${esc(d.title)}</div><div class="muted" style="font-size:12px;margin-top:2px">${esc(d.meta)}</div></div></div></li>` : `<li><div class="row"><span class="t eyebrow" style="width:92px">${esc(d.eyebrow)}</span><span class="locked">这一份你看不到；总台知道它存在</span></div></li>`)).join("")}</ul>`;
      }
      function decisionsList() {
        return DECISIONS.map(
          (d) =>
            `<div class="branch ${d.state}"><div class="eyebrow">${esc(d.eyebrow)}</div><div style="font-weight:${d.state === "rejected" ? 400 : 500};margin-top:2px">${esc(d.title)}</div><div class="muted" style="font-size:12.5px">${esc(d.detail)}</div></div>`,
        ).join("");
      }
      function asksList() {
        return `<ul class="list">${ASKS[role].map((a) => `<li><div class="row"><span class="t"><span class="dot ${a.kind === "merge" ? "cool" : "warn"}"></span></span><div style="flex:1"><div class="eyebrow faint">${esc(a.from)}</div><div style="margin-top:3px">${esc(a.text)}</div><div style="margin-top:8px;display:flex;gap:6px">${a.kind === "merge" ? '<button class="send" data-act="merge">合并</button><button class="ghost">先看 diff</button>' : '<button class="send">回答</button><button class="ghost">让幕僚长定</button>'}</div></div></div></li>`).join("")}</ul>`;
      }
      function personaCard() {
        const p = me();
        return `<div class="card" style="display:flex;gap:16px;align-items:flex-start"><span class="av" style="width:44px;height:44px;font-size:18px;border-radius:12px">${p.glyph}</span><div style="flex:1;min-width:0"><div class="eyebrow faint">${esc(p.latin)} · 你的幕僚长</div><div class="headline" style="font-size:20px;margin-top:4px">${esc(p.name)}</div><div class="serif ink2" style="margin-top:6px;font-size:15px">“${esc(p.motto)}”</div><div class="muted" style="font-size:12px;margin-top:8px">人设：${esc(p.tone)} · <a href="#" class="ink2" style="text-decoration:underline dotted">自定义</a></div></div></div>`;
      }
      function companyNote() {
        return `<div class="card" style="background:var(--paper-sunk);border-style:dashed"><div class="eyebrow faint">${COMPANY.latin} · 公司总台</div><div style="margin-top:6px" class="ink2">${esc(COMPANY.brief)} 你现在以 <b>${esc(R().title)}</b> 身份在看。总台不接任务；要动手，告诉你的幕僚长。</div></div>`;
      }

      // ---------- Variant A: 两栏，左私右公 ----------
      function VariantA() {
        return `<div class="two">
    <section>
      ${head(greet(), `${esc(R().name)}，${ASKS[role].length} 件事等你`, `${esc(me().name)} 替你盯着三个项目和所有信道。`, "md")}
      <div style="margin-top:18px">${personaCard()}</div>
      <div style="margin-top:22px">${head("NEEDS YOU", "需要你定", null, "sm")}<div style="margin-top:8px">${asksList()}</div></div>
      <div class="composer"><input placeholder="对 ${esc(me().name)} 说：派个活、问进度、改派……（@总台 可以问公司的事）"><button class="send">发送</button></div>
    </section>
    <section>
      ${head("COMPANY · FRONT DESK", "公司今天", COMPANY.brief, "md", `<span class="eyebrow faint">以 ${esc(R().title)} 身份</span>`)}
      <div class="tiles" style="margin-top:18px">
        <div class="tile"><span class="eyebrow">PROJECTS</span><div><b class="num">${R().projects.length}<span class="muted" style="font-size:13px;font-weight:500">/3</span></b><small>你可见的项目</small></div></div>
        <div class="tile"><span class="eyebrow">AGENTS</span><div><b class="num">${Object.entries(
          PROJECTS,
        )
          .filter(([id]) => canSeeProject(id))
          .reduce((n, [, p]) => n + p.workers, 0)}</b><small>正在工作的 Worker</small></div></div>
        <div class="tile"><span class="eyebrow">DOCS</span><div><b class="num">${DOCS.filter(canSeeDoc).length}<span class="muted" style="font-size:13px;font-weight:500">/${DOCS.length}</span></b><small>你能打开的文档</small></div></div>
      </div>
      <div class="cols" style="margin-top:28px;grid-template-columns:1.2fr 1fr">
        <div>${head("PROJECTS", "项目进展", null, "sm")}<div style="margin-top:8px">${projectsList(false)}</div>
          <div style="margin-top:22px">${head("DECISIONS", "决定记录", null, "sm")}<div style="margin-top:8px">${decisionsList()}</div></div></div>
        <div>${head("DOCUMENTS", "文档与制度", null, "sm")}<div style="margin-top:8px">${docsList()}</div>
          <div style="margin-top:22px">${head("PEOPLE", "谁在做什么", null, "sm")}<ul class="list" style="margin-top:8px">${PEOPLE.map((p) => `<li><div class="row"><span class="t"><span class="dot ${p.state}"></span></span><div><span class="who">${esc(p.name)}<span class="eyebrow">${esc(p.role)}</span></span><div class="muted" style="font-size:12.5px">${esc(p.now)}</div></div></div></li>`).join("")}</ul></div></div>
      </div>
    </section>
  </div>`;
      }
      VariantA.label = "两栏：左边我的幕僚长，右边公司总台";

      // ---------- Variant B: 头版 ----------
      function VariantB() {
        return `<div class="frontpage">
    <section>
      <div class="lead">${head("FRONT PAGE · " + new Date().toLocaleDateString("zh-CN", { month: "long", day: "numeric" }), "公司今天", "总台整理的头版。每个人看到的版面不同：你是" + esc(R().title) + "，所以有 " + DOCS.filter(canSeeDoc).length + " 份文档、" + R().projects.length + " 个项目进了你的版。", "lg")}</div>
      <div class="cols" style="margin-top:26px">
        ${Object.entries(PROJECTS)
          .map(([id, p]) =>
            canSeeProject(id)
              ? `<article><div class="eyebrow faint">${esc(p.lead)} · <span class="${p.status}">${p.status === "live" ? "顺利" : p.status === "warn" ? "等人" : "受阻"}</span></div><h3 class="headline" style="font-size:20px;margin:6px 0 8px">${esc(p.name)}</h3><p class="ink2" style="margin:0;line-height:1.8">${esc(p.line)}</p><p class="muted" style="font-size:12px;margin:8px 0 0">${p.workers} 个 Worker · ${esc(p.pr)}</p></article>`
              : `<article><div class="eyebrow faint">${esc(p.lead)}</div><h3 class="headline faint" style="font-size:20px;margin:6px 0 8px">${esc(p.name)}</h3><p class="locked" style="margin:0">版面上有这个项目，但内容不对你开放。</p></article>`,
          )
          .join("")}
      </div>
      <div class="rule" style="margin:26px 0"></div>
      <div class="cols" style="grid-template-columns:1fr 1fr">
        <div>${head("DECISIONS", "决定记录", null, "sm")}<div style="margin-top:8px">${decisionsList()}</div></div>
        <div>${head("DOCUMENTS", "文档与制度", null, "sm")}<div style="margin-top:8px">${docsList()}</div></div>
      </div>
    </section>
    <aside class="rail">
      ${personaCard()}
      <div class="card" style="margin-top:14px">${head("NEEDS YOU", `${ASKS[role].length} 件等你定`, null, "sm")}<div style="margin-top:6px">${asksList()}</div>
        <div class="composer" style="margin-top:14px;padding:10px 10px 10px 14px"><input placeholder="对 ${esc(me().name)} 说……"><button class="send">发送</button></div></div>
      ${'<div style="margin-top:14px">' + companyNote() + "</div>"}
    </aside>
  </div>`;
      }
      VariantB.label = "头版：公司是正文，我的幕僚长是右栏";

      // ---------- Variant C: 一条对话，总台是可 @ 的参与者 ----------
      function VariantC() {
        const p = me();
        const r = R();
        const lockedDocs = DOCS.filter((d) => !canSeeDoc(d)).length;
        return `<div style="max-width:820px;margin:0 auto">
    ${head(greet(), `${esc(r.name)}，今天的事`, `这是你和 ${esc(p.name)} 的对话。@总台 把公司的信息拉进来，它只回答，不动手。`, "md", `<button class="ghost">自定义 ${esc(p.name)}</button>`)}
    <div style="margin-top:20px">
      <div class="msg"><span class="av">${p.glyph}</span><div><div class="name">${esc(p.name)}<span class="eyebrow">${esc(p.latin)} · 你的幕僚长</span><time>09:00</time></div><div class="body">早。${ASKS[role].length} 件事等你定，我按紧急排好了。最急的是<b>${esc(ASKS[role][0].text)}</b></div>
        <div class="inline">${asksList()}</div></div></div>
      <div class="msg user"><span class="av light">${r.glyph}</span><div><div class="name">${esc(r.name)}<span class="eyebrow">YOU</span><time>09:04</time></div><div class="body">@总台 公司今天什么情况，有没有我该知道的决定？</div></div></div>
      <div class="joinrule">总台 加入对话 · 只读 · 按 ${esc(r.title)} 过滤</div>
      <div class="msg"><span class="av light">${COMPANY.glyph}</span><div><div class="name">${esc(COMPANY.name)}<span class="eyebrow">${COMPANY.latin} · 公司总台</span><time>09:04</time></div><div class="body">给你 ${esc(r.title)} 能看的版本：${r.projects.length} 个项目在你视野内${lockedDocs ? `，另有 ${lockedDocs} 份文档对你不开放，我只说它们存在` : ""}。</div>
        <div class="inline"><div class="eyebrow">PROJECTS</div><div style="margin-top:6px">${projectsList(true)}</div></div>
        <div class="inline"><div class="eyebrow">DECISIONS · 最近</div><div style="margin-top:4px">${decisionsList()}</div></div>
        <div class="inline"><div class="eyebrow">DOCUMENTS</div><div style="margin-top:6px">${docsList()}</div></div>
        <div class="body muted" style="font-size:12.5px">要推进其中哪件，和 ${esc(p.name)} 说，我不接任务。</div></div></div>
      <div class="msg"><span class="av">${p.glyph}</span><div><div class="name">${esc(p.name)}<span class="eyebrow">↳ 接着总台说</span><time>09:05</time></div><div class="body">${role === "admin" ? "官网 PR #88 我建议今天合，CI 和评审都过了；移动端那台机器我可以帮周清野申请云容器配额，你点头就行。" : role === "lead" ? "PR #88 是你的，合并前要不要我把 diff 摘要发到企微群？RSS 封面图我倾向 og:image。" : "云容器配额我已经起草了申请，等你确认就发给林砚。"}</div></div></div>
    </div>
    <div class="composer"><input placeholder="对 ${esc(p.name)} 说……  输入 @ 可以叫 总台"><button class="send">发送</button></div>
  </div>`;
      }
      VariantC.label = "对话：我的幕僚长主场，@总台 把公司拉进来";

      // ---------- shell wiring ----------
      const VARIANTS = { A: VariantA, B: VariantB, C: VariantC };
      const keys = Object.keys(VARIANTS);
      const current = () => {
        const v = new URLSearchParams(location.search).get("variant");
        return keys.includes(v) ? v : "A";
      };
      function setParam(k, v) {
        const u = new URL(location);
        u.searchParams.set(k, v);
        history.replaceState(null, "", u);
      }
      function render() {
        const v = current();
        const r = R();
        document.getElementById("app").innerHTML = VARIANTS[v]();
        document.getElementById("lab").innerHTML = `<b>${v}</b> · ${VARIANTS[v].label}`;
        document.getElementById("nav-mine").innerHTML = [
          ["今天", "TODAY", true],
          [me().name + "（幕僚长）", "CHIEF OF STAFF"],
          ["我的工单", "TICKETS"],
          ["日历", "CALENDAR"],
        ]
          .map(
            ([l, e, on]) =>
              `<button class="${on ? "on" : ""}"><span class="glyph">${l[0]}</span>${esc(l)}${on ? `<span class="eyebrow">${e}</span>` : ""}</button>`,
          )
          .join("");
        document.getElementById("nav-company").innerHTML = [
          ["总台", "FRONT DESK"],
          ["项目", "PROJECTS"],
          ["文档", "DOCS"],
          ["决定", "DECISIONS"],
          ["成员与授权", "PEOPLE"],
        ]
          .map(([l, e]) => `<button><span class="glyph">${l[0]}</span>${esc(l)}</button>`)
          .join("");
        document.getElementById("me-glyph").textContent = r.glyph;
        document.getElementById("me-name").textContent = r.name;
        document.getElementById("me-latin").textContent = r.latin;
        document.getElementById("crumb-a").textContent = "工作";
        document.getElementById("crumb-b").textContent = "今天";
        document
          .querySelectorAll("[data-role]")
          .forEach((b) => b.classList.toggle("on", b.dataset.role === role));
        const n = new Date();
        document.getElementById("today").textContent =
          `${n.getMonth() + 1} 月 ${n.getDate()} 日 · 周${"日一二三四五六"[n.getDay()]}`;
        document.getElementById("state").innerHTML =
          `<b>状态</b> variant=${v} · as=${role}（${esc(r.title)}）· 可见项目 ${r.projects.length}/3 · 可见文档 ${DOCS.filter(canSeeDoc).length}/${DOCS.length} · 等你定 ${ASKS[role].length}`;
      }
      document.getElementById("prev").onclick = () => {
        setParam("variant", keys[(keys.indexOf(current()) + keys.length - 1) % keys.length]);
        render();
      };
      document.getElementById("next").onclick = () => {
        setParam("variant", keys[(keys.indexOf(current()) + 1) % keys.length]);
        render();
      };
      document.addEventListener("keydown", (e) => {
        if (e.target.closest && e.target.closest("input,textarea,[contenteditable]")) return;
        if (e.key === "ArrowLeft") document.getElementById("prev").click();
        if (e.key === "ArrowRight") document.getElementById("next").click();
      });
      document.addEventListener("click", (e) => {
        const b = e.target.closest("[data-role]");
        if (b) {
          role = b.dataset.role;
          setParam("as", role);
          render();
          return;
        }
        const m = e.target.closest("[data-act=merge]");
        if (m) {
          m.textContent = "已请求合并（原型，不生效）";
          m.disabled = true;
        }
      });
      render();
    </script>
  </body>
</html>
