# Nightly merge of pingdotgg/t3code main into this fork's main. It always keeps its progress:
#
# 1. Merge. Conflicts that exist only because of the Codi rename are resolved by script. Claude
#    Code resolves the rest with upstream winning, and what it still leaves takes upstream's side.
# 2. Re-apply the rename and the agent context budget by script.
# 3. Run check:changed. On a failure Claude fixes what the merge broke and the check runs again.
# 4. Checks pass and Telescope's design is untouched → pushed to main. Otherwise the result is
#    pushed to the upstream-sync branch with a pull request, and the next run continues from that
#    branch instead of starting over. Merge that pull request with a merge commit, never a squash:
#    later merges need upstream's history.
#
# Secrets:
# - UPSTREAM_SYNC_TOKEN: fine-grained PAT (this repo, Contents + Workflows + Pull requests
#   read/write). GITHUB_TOKEN cannot push commits that touch workflow files, and pull requests it
#   opens do not start CI.
# - CLAUDE_CODE_OAUTH_TOKEN: from `claude setup-token`, valid one year.
name: Upstream sync

on:
  schedule:
    - cron: "0 2 * * *" # 03:00 CET / 04:00 CEST
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency: upstream-sync

env:
  SYNC_BRANCH: upstream-sync
  BUDGET: apps/server/src/provider/agentContextBudget.json

jobs:
  sync:
    if: github.repository == 'TONiiV/Codi'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}

      - name: Fetch upstream
        id: fetch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/pingdotgg/t3code.git
          git fetch --quiet upstream main
          git fetch --quiet origin "+refs/heads/$SYNC_BRANCH:refs/remotes/origin/$SYNC_BRANCH" || true

          echo "before=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "behind=$(git rev-list --count HEAD..upstream/main)" >> "$GITHUB_OUTPUT"
          if [ "$(git rev-list --count HEAD..upstream/main)" = 0 ]; then
            echo "Already up to date with upstream." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Vite+
        if: steps.fetch.outputs.run == 'true'
        uses: ./.github/actions/setup-ci-deps
        with:
          install: "false"

      - name: Prepare Claude
        if: steps.fetch.outputs.run == 'true'
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

          cat > "$RUNNER_TEMP/policy.md" <<EOF
          This repository is TONiiV/Codi (product name "Codi"), a fork of pingdotgg/t3code
          (upstream, product name "T3 Code"). A nightly job merges upstream into the fork.

          Policy, in this order:
          1. Upstream wins. Take upstream's logic, structure, copy and file layout. When upstream
             deleted or replaced a file or a feature, accept that (git rm a file it deleted), even
             when the fork had changes there. This includes .macroscope/ and everything else that
             is not listed in rule 2.
          2. Keep these fork things on top of upstream's version:
             - Telescope: apps/server/src/telescope, apps/web/src/components/telescope,
               Telescope RPCs, settings, layers and navigation.
             - i18n in apps/web: a t("key") call stays when its key exists in
               apps/web/src/i18n/locales/en.json. When upstream reworded that string, update the
               value in en.json. Text upstream added stays an English literal: add no keys.
               Fork helpers take a t argument, such as searchableSetting(id, t).
             - The theme backdrop, brand assets under brand/, the language setting, the fork's own
               README.md, and runs-on: ubuntu-24.04 in workflows.
          3. Both sides added different things at the same place: keep both.
          4. Write product text as upstream has it ("T3 Code"). A script renames it afterwards.
          5. A fork quarantine ("// quarantine: #N <why>" above an it.skip) on a test upstream
             changed or renamed: take upstream's test and put the same comment and .skip on it.
             If upstream deleted that scenario, drop the quarantine.
          6. Never skip, disable or delete a test to make a check pass. Except for a conflicted
             file, never edit .github/, scripts/ or files under .repos/.

          Telescope design: adapting Telescope code to a changed upstream API is fine. When a
          change alters how Telescope behaves or looks, make your best choice and add one line
          per change to $RUNNER_TEMP/telescope-review.md. The job then opens a pull request
          for the maintainer instead of pushing to main.

          Report: append to $RUNNER_TEMP/claude-report.md in Chinese, one short line per file
          you changed. End with two lists: fork changes that upstream's side replaced, and new
          upstream UI text that still needs i18n keys.
          EOF

          cat > "$RUNNER_TEMP/claude-run.sh" <<'EOF'
          #!/usr/bin/env bash
          # claude-run.sh <prompt file> <extra allowed tool>...
          prompt="$(cat "$RUNNER_TEMP/policy.md" "$1")"
          shift
          claude -p "$prompt" \
            --model claude-sonnet-5-5 --effort medium \
            --add-dir "$RUNNER_TEMP" \
            --permission-mode acceptEdits \
            --allowedTools "Read" "Edit" "Write" "Glob" "Grep" \
              "Bash(git diff:*)" "Bash(git log:*)" "Bash(git show:*)" "Bash(git status:*)" \
              "Bash(git add:*)" "Bash(git rm:*)" "Bash(git checkout --theirs:*)" \
              "Bash(git checkout --ours:*)" "Bash(vp install:*)" "$@" \
            >> "$RUNNER_TEMP/claude.log" 2>&1
          status=$?
          tail -40 "$RUNNER_TEMP/claude.log"
          exit $status
          EOF
          chmod +x "$RUNNER_TEMP/claude-run.sh"

      - name: Merge
        id: merge
        if: steps.fetch.outputs.run == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          fail() { echo "reason=$1" >> "$GITHUB_OUTPUT"; echo "::error::$1"; exit 1; }
          unmerged() { git diff --name-only --diff-filter=U; }
          # Changes outside these belong to the conflicts; Claude may also touch the locale files.
          outside() { awk 'NR == FNR { c[$0] = 1; next } { split($0, a, "\t") } !(a[2] in c) && a[2] != "pnpm-lock.yaml" && a[2] !~ /^apps\/web\/src\/i18n\/locales\//' "$RUNNER_TEMP/conflicts" -; }

          # merge_in <ref> <what the incoming side is>
          merge_in() {
            git merge --no-edit "$1" && return
            # Generated byte counts: take the incoming ones, a later step measures them again.
            if [ -n "$(git ls-files -u -- "$BUDGET")" ]; then
              git checkout --theirs -- "$BUDGET" && git add -- "$BUDGET"
            fi
            node scripts/resolve-rebrand-conflicts.mjs > "$RUNNER_TEMP/by-script"
            echo "Resolved by script: $(wc -l < "$RUNNER_TEMP/by-script") files"
            unmerged > "$RUNNER_TEMP/conflicts"
            if [ -s "$RUNNER_TEMP/conflicts" ]; then
              git ls-files -s | awk '$3 == 0' | outside > "$RUNNER_TEMP/index-before"
              cat > "$RUNNER_TEMP/prompt.md" <<EOF

          Task: a git merge is in progress in the current directory. "Theirs" is $2. The
          conflicted files are listed in $RUNNER_TEMP/conflicts. Resolve every one of them by
          the policy and git add it; leave none unresolved and no conflict markers. For
          pnpm-lock.yaml: resolve the package.json files first, then git checkout --theirs
          pnpm-lock.yaml and run vp install --no-frozen-lockfile. Edit only the conflicted
          files and the locale files. Do not commit, push or switch branches.
          EOF
              "$RUNNER_TEMP/claude-run.sh" "$RUNNER_TEMP/prompt.md" \
                || fail "Claude Code failed while resolving conflicts"
              git ls-files -s | awk '$3 == 0' | outside | diff -q "$RUNNER_TEMP/index-before" - >/dev/null \
                || fail "Claude changed files outside the conflicts"
              git diff --name-only | sed 's/^/-\t/' | outside | cut -f2 | xargs -r git checkout --
              # Upstream wins for whatever Claude left, so one hard file never blocks the sync.
              unmerged > "$RUNNER_TEMP/left"
              xargs -r grep -lE '^(<<<<<<<|>>>>>>>) ' < "$RUNNER_TEMP/conflicts" >> "$RUNNER_TEMP/left" 2>/dev/null || true
              sort -u "$RUNNER_TEMP/left" | while IFS= read -r file; do
                if git cat-file -e "MERGE_HEAD:$file" 2>/dev/null; then
                  git checkout MERGE_HEAD -- "$file"
                else
                  git rm -q --ignore-unmatch -- "$file"
                fi
                echo "- \`$file\`：Claude 没有解决，已直接取上游版本" >> "$RUNNER_TEMP/claude-report.md"
              done
              git add -u
            fi
            # check:changed is the gate; the pre-commit hook would only repeat part of it.
            git commit --no-edit --no-verify
          }

          # Continue from the last run's saved result when main does not contain it yet.
          if git rev-parse -q --verify "origin/$SYNC_BRANCH" >/dev/null \
            && ! git merge-base --is-ancestor "origin/$SYNC_BRANCH" HEAD; then
            merge_in "origin/$SYNC_BRANCH" "the previous run's saved merge of upstream into the fork; ours has newer fork commits, which also stay"
          fi
          if ! git merge-base --is-ancestor upstream/main HEAD; then
            merge_in upstream/main "upstream (pingdotgg/t3code main)"
          fi

      # The merge can change the pinned Vite+, Node.js or pnpm.
      - name: Setup Vite+ for the merged tree
        if: steps.fetch.outputs.run == 'true'
        uses: ./.github/actions/setup-ci-deps
        with:
          install: "false"

      - name: Re-apply the rename and check
        id: check
        if: steps.fetch.outputs.run == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          vp install
          # New upstream copy arrives as "T3 Code". The rename also shrinks the byte budget.
          node scripts/rebrand-codi.mjs
          node scripts/refresh-agent-context-budget.ts \
            || echo "- agent context budget 变大了：需要先跑 evals/README.md 里的 evals，再手动调高" >> "$RUNNER_TEMP/claude-report.md"
          git diff --name-only | xargs -r vp fmt --no-error-on-unmatched-pattern
          git diff --quiet || git commit -qam "chore: re-apply the Codi rename after the upstream merge" --no-verify
          # Web and server browser tests run in headless Chromium; the runner has none.
          node apps/web/node_modules/playwright/cli.js install --with-deps --only-shell chromium || true

          cat > "$RUNNER_TEMP/fix.md" <<EOF

          Task: the merge of upstream into the fork is committed, and "vp run check:changed"
          failed on it. Its output is in $RUNNER_TEMP/check.log. Fix what the merge broke, by
          the policy. Typical causes: fork code calls an upstream API that changed, a t("key")
          whose English text upstream reworded (update en.json), an import one side removed.
          Make the smallest change, and confirm it with the same check on the files you
          changed (vp run typecheck, vp test run <files>, vp lint <files>). Do not commit.
          EOF
          # The PR checks, scoped to what the fork changes relative to upstream. Upstream's own CI
          # covers its changes.
          for attempt in 1 2 3; do
            if vp run check:changed upstream/main > "$RUNNER_TEMP/check.log" 2>&1; then
              echo "passed=true" >> "$GITHUB_OUTPUT"
              break
            fi
            tail -80 "$RUNNER_TEMP/check.log"
            [ "$attempt" = 3 ] && break
            "$RUNNER_TEMP/claude-run.sh" "$RUNNER_TEMP/fix.md" \
              "Bash(vp run typecheck:*)" "Bash(vp test run:*)" "Bash(vp lint:*)" "Bash(vp fmt:*)" \
              || break
            git add -A
            git diff --cached --name-only | xargs -r vp fmt --no-error-on-unmatched-pattern
            git add -A
            git diff --cached --quiet && break
            git commit -qm "fix: adapt the fork to the upstream merge" --no-verify
          done

      - name: Land
        id: land
        if: steps.fetch.outputs.run == 'true'
        env:
          PAT: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          PASSED: ${{ steps.check.outputs.passed }}
        run: |
          # A Telescope change the maintainer has not merged yet keeps the sync on the pull request.
          GH_TOKEN=$GITHUB_TOKEN gh pr list --head "$SYNC_BRANCH" --base main --state open --json body --jq '.[].body' 2>/dev/null \
            | awk '/^### Telescope/ { on = 1; next } /^### / { on = 0 } on && NF' > "$RUNNER_TEMP/held" || true
          if [ -s "$RUNNER_TEMP/held" ]; then
            cat "$RUNNER_TEMP/telescope-review.md" >> "$RUNNER_TEMP/held" 2>/dev/null || true
            sort -u "$RUNNER_TEMP/held" > "$RUNNER_TEMP/telescope-review.md"
          fi
          {
            echo "Upstream is ${{ steps.fetch.outputs.behind }} commits ahead of \`${{ steps.fetch.outputs.before }}\`."
            if [ -s "$RUNNER_TEMP/telescope-review.md" ]; then
              echo; echo "### Telescope 设计变更，需要你确认"; cat "$RUNNER_TEMP/telescope-review.md"
            fi
            if [ "$PASSED" != true ]; then
              echo; echo "### check:changed 仍未通过"; echo '```'
              sed 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/check.log" \
                | grep -E 'error TS|^ *FAIL |AssertionError|^ *(pass|FAIL)  ' | head -60
              echo '```'
            fi
            if [ -s "$RUNNER_TEMP/claude-report.md" ]; then
              echo; echo "### 冲突处理报告"; cat "$RUNNER_TEMP/claude-report.md"
            fi
          } > "$RUNNER_TEMP/body.md"

          if [ "$PASSED" = true ] && [ ! -s "$RUNNER_TEMP/telescope-review.md" ]; then
            git push origin HEAD:main
            git push origin ":refs/heads/$SYNC_BRANCH" 2>/dev/null || true
            { echo "## Merged into main"; cat "$RUNNER_TEMP/body.md"; } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git push --force origin "HEAD:refs/heads/$SYNC_BRANCH"
          { echo "## Saved to \`$SYNC_BRANCH\`, not merged"; cat "$RUNNER_TEMP/body.md"; } >> "$GITHUB_STEP_SUMMARY"
          {
            echo "夜间上游同步的结果保存在这个分支，下一次运行会在它的基础上继续。"
            echo "合并时请用 merge commit，不要 squash。"
            echo
            cat "$RUNNER_TEMP/body.md"
          } > "$RUNNER_TEMP/pr.md"
          # The PAT first: a pull request opened with GITHUB_TOKEN does not start CI.
          for token in "$PAT" "$GITHUB_TOKEN"; do
            [ -n "$token" ] || continue
            if [ -n "$(GH_TOKEN=$token gh pr list --head "$SYNC_BRANCH" --base main --state open --json number --jq '.[].number')" ]; then
              GH_TOKEN=$token gh pr edit "$SYNC_BRANCH" --body-file "$RUNNER_TEMP/pr.md" && opened=true && break
            elif GH_TOKEN=$token gh pr create --head "$SYNC_BRANCH" --base main \
              --title "chore: merge upstream (needs a look)" --body-file "$RUNNER_TEMP/pr.md"; then
              opened=true && break
            fi
          done
          if [ "${opened:-}" != true ]; then
            GH_TOKEN=$GITHUB_TOKEN gh issue create --title "Upstream sync saved to $SYNC_BRANCH" \
              --body-file "$RUNNER_TEMP/pr.md" || true
          fi
          [ "$PASSED" = true ] || { echo "::error::check:changed failed; the merge is saved on $SYNC_BRANCH"; exit 1; }

      - name: Report a blocked sync
        if: failure() && steps.fetch.outputs.run == 'true' && steps.land.outcome == 'skipped'
        run: |
          {
            echo "## ❌ Upstream sync blocked before anything could be saved"
            echo "main stays at \`${{ steps.fetch.outputs.before }}\`. Upstream is ${{ steps.fetch.outputs.behind }} commits ahead."
            echo
            echo "**Reason:** ${{ steps.merge.outputs.reason || 'a step failed, see the log' }}"
            if grep -qiE 'oauth|unauthori[sz]ed|401|invalid api key|expired' "$RUNNER_TEMP/claude.log" 2>/dev/null; then
              echo
              echo "> Claude authentication failed. The token may have expired: run \`claude setup-token\` and update \`CLAUDE_CODE_OAUTH_TOKEN\`."
            fi
            if grep -qiE "hit your .*limit" "$RUNNER_TEMP/claude.log" 2>/dev/null; then
              echo
              echo "> Claude usage limit reached: $(grep -oiE "hit your .*limit[^\"]*" "$RUNNER_TEMP/claude.log" | head -1). Re-run this workflow after the reset."
            fi
            if [ -s "$RUNNER_TEMP/conflicts" ]; then
              echo
              echo "Conflicted files:"
              sed 's/^/- `/; s/$/`/' "$RUNNER_TEMP/conflicts"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
